  <style>
    .hero{padding:48px 0 10px}
    .hero h1{font-size:clamp(30px,5vw,54px); line-height:1.02; margin:12px 0 12px; font-weight:700}
    .hero p.lead{color:var(--tx2); font-size:16.5px; max-width:720px; margin:0; white-space:pre-line}
    h2{font-size:22px; margin:40px 0 14px}
    .servicios{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
    .serv{padding:18px; display:flex; gap:12px; align-items:flex-start}
    .serv .ico{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:rgba(224,184,88,.1); color:var(--amber); flex:none}
    .serv b{font-size:15px; line-height:1.35}
    .videos{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px}
    .video{aspect-ratio:16/9; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000}
    .video iframe{width:100%; height:100%; border:0}
    .contacto{padding:22px; display:flex; flex-wrap:wrap; gap:10px; align-items:center}
    .contacto p{margin:0 auto 0 0; color:var(--tx2); font-size:14px; max-width:520px}
    .gob{margin-top:14px; font-size:13px; color:var(--tx3)}
    .empty{padding:40px; text-align:center; color:var(--tx2)}
    .trabajo{display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:16px}
    .trabajo .video{border-radius:10px}
    .trabajo h3{margin:4px 4px 0; font-size:16px; line-height:1.3; font-family:'Inter'; letter-spacing:0}
    .trabajo .meta{margin:0 4px; font-size:12.5px; color:var(--tx3)}
    .trabajo p{margin:0 4px 4px; font-size:14px; color:var(--tx2); line-height:1.5}
    @media (max-width:520px){ .videos{grid-template-columns:minmax(0,1fr)} }
  </style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="logo-nav.webp" alt="NOVA AUDIOVISUAL" width="65" height="48"><small>Productora audiovisual</small></a>
    <span class="rec">REC</span>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="novaudiovisual-trabajos.html">Trabajos</a>
      <a href="novaudiovisual-fondos.html">Fondos y festivales</a>
      <a href="novaudiovisual-licitaciones.html">Licitaciones</a>
      <a href="novaudiovisual-tarifas.html">Tarifas</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <div class="glass empty" style="margin-top:60px">Cargando…</div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>NOVA AUDIOVISUAL SPA · RUT 77.836.298-8 · Renca, Región Metropolitana</span>
    <span><a href="https://novaudiovisual-lab.github.io/nova-audiovisual/" target="_blank" rel="noopener">Sitio de la productora ↗</a> · <a href="index.html">Portal NOVAUDIOVISUAL</a></span>
  </div>
</footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons = () => window.lucide && lucide.createIcons();
  // Íconos según el servicio
  const ico = s => /stream|vivo|transmi/i.test(s) ? 'radio' : /foto/i.test(s) ? 'camera' : /evento|registro|cobertura/i.test(s) ? 'calendar-check' : /redes|c[aá]psula|contenido/i.test(s) ? 'smartphone' : /edici|post/i.test(s) ? 'scissors' : /dron|a[eé]re/i.test(s) ? 'plane' : 'clapperboard';
  // Solo YouTube y Vimeo, con su reproductor oficial
  function embed(u){
    let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
    if (m) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
    m = u.match(/vimeo\.com\/(\d+)/);
    return m ? `https://player.vimeo.com/video/${m[1]}` : null;
  }

  // v = vitrina del radar (puede venir sin publicar); trabajos = portafolio.json con título y descripción
  function pintar(v, trabajos){
    v = v.publicar ? v : { titulo: 'NOVAUDIOVISUAL · Productora audiovisual', bajada: 'Videos de todo tipo, streaming multicámara, fotografía, realidad virtual con Unreal Engine y sets virtuales.' };
    const servicios = String(v.servicios || '').split('\n').map(s => s.trim()).filter(Boolean);
    const conDescripcion = new Set(trabajos.map(t => embed(t.youtube || '')).filter(Boolean));
    const videos = (v.videos || []).map(embed).filter(src => src && !conDescripcion.has(src));
    const tarjetas = trabajos.map(t => ({ ...t, src: embed(t.youtube || '') })).filter(t => t.src);
    const wa = String(v.telefono || '').replace(/[^\d]/g, '');
    const ig = String(v.instagram || '').replace(/^@/, '').replace(/[^\w.]/g, '');
    $('#main').innerHTML = `
      <section class="hero">
        <span class="tag cl">Productora audiovisual · Chile</span>
        <h1>${esc(v.titulo || 'NOVAUDIOVISUAL')}</h1>
        ${v.bajada ? `<p class="lead">${esc(v.bajada)}</p>` : ''}
        <p class="gob">✔ Proveedor del Estado: cotizamos por Compra Ágil y licitaciones en Mercado Público.</p>
      </section>
      ${servicios.length ? `<h2>Servicios</h2><div class="servicios">${servicios.map(s => `<div class="glass serv"><span class="ico"><i data-lucide="${ico(s)}" class="icon"></i></span><b>${esc(s)}</b></div>`).join('')}</div>` : ''}
      ${tarjetas.length || videos.length ? `<h2>Trabajos realizados</h2><div class="videos">${tarjetas.map(t => `<article class="glass trabajo">
          <div class="video"><iframe src="${t.src}" title="${esc(t.titulo || 'Trabajo realizado')}" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
          <h3>${esc(t.titulo || '')}</h3>
          ${[t.cliente, t.tipo, t.anio].filter(Boolean).length ? `<div class="meta">${[t.cliente, t.tipo, t.anio].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
          ${t.descripcion ? `<p>${esc(t.descripcion)}</p>` : ''}
        </article>`).join('')}${videos.map(src => `<div class="video"><iframe src="${src}" title="Video del portafolio" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`).join('')}</div>` : ''}
      <h2>Contacto</h2>
      <div class="glass contacto">
        <p>Cuéntanos qué necesitas: te enviamos una cotización formal, también por Compra Ágil.</p>
        ${v.email ? `<a class="btn btn-main" href="mailto:${esc(v.email)}?subject=${encodeURIComponent('Cotización NOVAUDIOVISUAL')}"><i data-lucide="mail" class="icon"></i>${esc(v.email)}</a>` : ''}
        ${wa ? `<a class="btn btn-ghost" href="https://wa.me/${wa}" target="_blank" rel="noopener"><i data-lucide="message-circle" class="icon"></i>WhatsApp</a>` : ''}
        ${ig ? `<a class="btn btn-ghost" href="https://instagram.com/${ig}" target="_blank" rel="noopener"><i data-lucide="instagram" class="icon"></i>@${esc(ig)}</a>` : ''}
      </div>`;
    icons();
  }

  Promise.all([
    fetch('https://nova-radar.simonrovi.workers.dev/public/vitrina').then(r => r.json()).catch(() => ({})),
    fetch('portafolio.json', { cache: 'no-cache' }).then(r => r.json()).then(p => p.trabajos || []).catch(() => []),
  ]).then(([v, trabajos]) => {
    if (v.publicar || trabajos.length) pintar(v, trabajos);
    else $('#main').innerHTML = '<div class="glass empty" style="margin-top:60px">Estamos preparando esta página. Vuelve pronto.</div>';
  });
  icons();
})();
</script>
<script src="install.js" defer></script>
<script>if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
